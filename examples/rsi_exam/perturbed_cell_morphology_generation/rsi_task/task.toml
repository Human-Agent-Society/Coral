schema_version = "1.3"
artifacts = ["/app/methods", "/app/submission"]

[task]
name = "autoresearch-arena/perturbed_cell_morphology_generation"
authors = [{ name = "aiminglab" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 21600.0
cpus = 4
memory_mb = 16384
storage_mb = 40960
network_mode = "public"

[environment.env]
CUDA_VISIBLE_DEVICES = "0"

[verifier]
environment_mode = "separate"
timeout_sec = 1800.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 21600.0
cpus = 4
memory_mb = 16384
storage_mb = 40960
network_mode = "no-network"

[verifier.env]
CUDA_VISIBLE_DEVICES = "0"
