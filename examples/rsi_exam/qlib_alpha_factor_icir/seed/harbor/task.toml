schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/qlib_alpha_factor_icir"
description = "Build a cross-sectional return-prediction model on an anonymized daily factor panel; graded by ICIR on a hidden later period."
authors     = [{ name = "jinghai he" }]

[environment]
build_timeout_sec = 3600.0
network_mode = "public"
cpus       = 4
memory_mb  = 12288
storage_mb = 20480
gpus       = 0

[agent]
network_mode = "no-network"
timeout_sec  = 43200.0

[verifier]
timeout_sec      = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[verifier.env]

[scoring]
metric = "icir"
direction = "higher"
