schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/flashfftconv_multistream_gated_forward_speedup"
description = "Optimize independent multi-stream gated causal convolutions in the published FP16 D=768, length-2048 regime across multiple batch/stream/head factorizations on NVIDIA H100."
authors = [{ name = "riken" }]

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
workdir = "/app"
cpus = 8
memory_mb = 65536
storage_mb = 20480

[verifier]
timeout_sec = 3600.0
environment_mode = "separate"

[verifier.env]
SCORING_MODE = "raw_speedup_no_normalization"
HELDOUT_PANEL_SHA256 = "633d8e5f381fb735938208be572a727d56ca024761edbf3b3a4d33b431283537"
BASELINE_MANIFEST_SHA256 = "713b3cd0578f358163687dfc8181230a2c5fce8362e02ebdb8274ac54e7e0c90"
HUMAN_SOTA_RAW_SPEEDUP = "8.084160216828389"
UPPER_BOUND_RAW_SPEEDUP = "21.35700060863325"
EXPECTED_GPU_NAME = "PENDING_H100_REMEASURE"

[verifier.environment]
network_mode = "no-network"
build_timeout_sec = 1800.0
cpus = 8
memory_mb = 65536
storage_mb = 20480

[scoring]
metric = "raw_speedup"
direction = "higher"
