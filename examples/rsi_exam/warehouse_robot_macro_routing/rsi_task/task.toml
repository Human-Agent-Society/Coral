schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/warehouse_robot_macro_routing"
description = "Drive a warehouse cleanup robot (forward / turn / swap, plus a record-once / replay-many macro button) to sort every ball into its matching basket in as few button presses as possible, on an unseen maze-and-ball layout drawn from the AHC066 generator. Macro expansion is charged against the move budget T but a replay still counts as one pressed button, so the whole game is compressing a long move plan into short reusable macros; the score is relative to a reproduced contest rank-1 solver and the network is sealed so no championship code can be fetched."
authors     = [{ name = "xinyu ye" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 4
memory_mb  = 12288
storage_mb = 4096
gpus       = 0

[verifier]
timeout_sec      = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus       = 4
memory_mb  = 12288
storage_mb = 4096
gpus       = 0

[verifier.env]
PER_CASE_TIMEOUT_SEC = "20"

[scoring]
metric = "mean_relative_score_vs_rank1"
direction = "higher"
