schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/pbmc_batch_correction"
description = "Produce a batch-integrated cell embedding from binary PBMC scATAC-seq peaks; graded by cell-type NMI (scIB Leiden protocol) on a sealed split."
authors     = [{ name = "junchen" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 5400.0
network_mode = "public"
cpus       = 8
memory_mb  = 65536
storage_mb = 40960
gpus       = 0

[verifier]
timeout_sec      = 2400.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus         = 8
memory_mb    = 98304
storage_mb   = 40960
gpus         = 0
