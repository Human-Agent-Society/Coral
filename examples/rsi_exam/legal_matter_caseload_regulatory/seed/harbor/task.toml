schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/legal_matter_caseload_regulatory"
description = "Work six unrelated legal matters end-to-end on real case files (1,000+ documents: Senior Living Lending telemarketing/TCPA compliance, Harborview spinoff + cross-border data transfer, a BlueAnchor/BlueLNG JV with anti-SLAPP and shipyard-delay disputes, Northstar GDPR, Livyra FDA drug labelling, and TAC tariffs/force majeure under the UCC). Two containers: the agent has no rubric text anywhere in its image, and a separate grading service holds the visible rubrics and returns only a bare score (4/6) per submission — never which criteria nor their text — under a budget of 90 submissions across 18 visible questions (five each). The agent is required to work every visible question and push each score as high as it can. The 18 held-out questions (108 binary criteria) are scored with pass@1 — a question counts only if EVERY criterion is met, APEX-Agents' own headline metric: submitted once via `matter final`, no feedback, which ends the run. A sealed verifier judges them against rubrics held only in its own image. Adapted from APEX-Agents (Law split, the six worlds not used by apex_law_case_memory); judged by Gemini 3 Flash, the benchmark's own judge."
source      = "APEX-Agents (Law split): the case files, questions and rubrics come from the APEX-Agents benchmark; this task adapts the six worlds not used by apex_law_case_memory."
authors     = [{ name = "aiminglab" }]

[agent]
timeout_sec = 43200.0
network_mode  = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com"]

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 4
memory_mb  = 12288
storage_mb = 12288
gpus       = 0

[environment.env]
GRADER_URL = "http://127.0.0.1:8000"

[verifier]
timeout_sec      = 7200.0
environment_mode = "separate"

[verifier.environment]
network_mode  = "allowlist"
allowed_hosts = ["generativelanguage.googleapis.com"]
cpus       = 4
memory_mb  = 12288
storage_mb = 12288
[verifier.env]
APEX_LLM_API_KEY  = "${APEX_LLM_API_KEY}"
APEX_LLM_API_BASE = "${APEX_LLM_API_BASE:-https://generativelanguage.googleapis.com/v1beta/openai}"
APEX_JUDGE_MODEL  = "${APEX_JUDGE_MODEL:-gemini-3-flash-preview}"
APEX_JUDGE_EFFORT = "${APEX_JUDGE_EFFORT:-low}"
APEX_JUDGE_MAX_TOKENS = "${APEX_JUDGE_MAX_TOKENS:-512}"
APEX_JUDGE_SAMPLES = "${APEX_JUDGE_SAMPLES:-1}"

[scoring]
metric = "held_out_pass_at_1"
direction = "higher"
