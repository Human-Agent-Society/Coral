schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/johnson1991_leighton_graph_coloring"
description = "Minimize coloring conflicts at a fixed color budget on real, hard DIMACS/COLOR02 graphs (Leighton le450, Johnson DSJC, DSJR; n=450..1000). target_k is each graph's PUBLISHED best-known chromatic number, so a proper 0-conflict coloring provably exists but sits at the coloring frontier. The verifier reruns solve(data) on 7 sealed hidden graphs, one at a time under a 45s per-instance hard cap, and scores total monochromatic edges (lower is better), normalized from a reference TabuCol (score 0) to 0 conflicts = a proper coloring (score 1)."
authors     = [{ name = "haoting zhao" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 2
memory_mb  = 12288
storage_mb = 4096
gpus       = 0

[verifier]
timeout_sec      = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus       = 2
memory_mb  = 12288
storage_mb = 4096
gpus       = 0

[scoring]
metric = "kpi"
direction = "lower"
