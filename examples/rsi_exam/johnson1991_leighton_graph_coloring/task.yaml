task:
  name: rsi-exam-johnson1991_leighton_graph_coloring
  description: "Optimize the RSI-Exam task below. The CORAL worktree mirrors /app for submission paths\
    \ only: edit methods/ (and other declared artifacts). Public support code and Docker build inputs\
    \ are in harbor/environment/. Read instruction.md for the upstream contract.\n\nStart with `uv run\
    \ rsi_runtime.py bootstrap` to extract any missing image-generated baseline artifacts. Run visible\
    \ experiments with `uv run rsi_runtime.py run 'python /app/selfcheck.py'` (or the command in instruction.md).\
    \ This executes inside the original agent container and copies declared submission artifacts back\
    \ to the worktree.\n\nUse visible feedback for iteration, then submit the final method with `coral\
    \ eval -m 'final method'`. The default run stops after one real evaluation. Only declared artifacts\
    \ cross to the original separate verifier. Changing rsi_runtime.py, harbor/, or local support files\
    \ does not change the trusted grader. --tune does not run hidden tests.\n\n# Drive coloring conflicts\
    \ to zero at a fixed color budget\n\nYou inherit a TabuCol graph-coloring baseline. For every graph\
    \ you are given a **fixed\ncolor budget** `target_k`. Assign each vertex a color in `{0, 1, ..., target_k-1}`\
    \ so as\nto **minimize the number of monochromatic edges** (edges whose two endpoints share a\ncolor).\
    \ You may not use any color `>= target_k`.\n\n`target_k` is set to each graph's **best-known chromatic\
    \ number**, so a conflict-free\n(proper) `target_k`-coloring **provably exists** \u2014 but finding\
    \ one sits at the coloring\nfrontier and is very hard: a reference local search plateaus well above\
    \ zero. Your job is\nto get the conflict count as **low as possible** \u2014 ideally all the way to\
    \ 0.\n\nThis datapoint is **method-scored**, not answer-scored: your code is re-run by a separate\n\
    verifier on sealed hidden graphs. The visible graphs are only for development.\n\n## Hard Constraints\n\
    \n- You may only edit code under `/app/methods/main/`; you may add sibling `.py` modules.\n- Keep\
    \ the entrypoint signature `solve(data) -> {\"colorings\": [...]}`.\n- **Standard library + `numpy`\
    \ only** \u2014 no internet, no other third-party packages. The\n  verifier sandbox ships the SAME\
    \ `numpy` and nothing else, so `import numpy` is fine but\n  any other third-party import (networkx,\
    \ scipy, a solver package, \u2026) makes the submission\n  score 0.\n- **Per-instance 45s hard cap.**\
    \ The grader solves each graph in isolation and **kills any\n  graph that runs longer than 45 seconds**,\
    \ scoring that graph 0 (the others are\n  unaffected). Self-pace so every graph returns within 45s.\n\
    - Return one coloring per instance, in the same order as `data[\"instances\"]`. Each coloring\n  must\
    \ have length `n_vertices`; **every color must be an integer in `[0, target_k)`**. A\n  color `>=\
    \ target_k` or `< 0`, a wrong length, a non-integer, or a graph that exceeds 45s\n  scores 0 **for\
    \ that graph** (per-instance fail-closed), not for the whole submission.\n\n## What You Have\n\n-\
    \ `/app/data/visible.json`: visible graphs with anonymized names `pub0`, `pub1`, \u2026 . Each is\n\
    \  `{name, n_vertices, n_edges, edges, target_k}` with 0-indexed undirected edges.\n- `/app/methods/main/solver.py`\
    \ and `gc_lib.py`: the editable baseline (a single TabuCol run)\n  and helpers, including `reference_tabucol`.\
    \ **This directory is what gets graded.** Matching\n  the baseline gains you nothing; the task is\
    \ to beat it.\n- `/app/selfcheck.py`: a free local dry-run (`python /app/selfcheck.py`) that **mirrors\
    \ the\n  grader** \u2014 runs your solver on each visible graph under the SAME 45s per-instance cap,\n\
    \  validates the coloring, prints each graph's runtime + raw conflict count, and\n  tells you exactly\
    \ which graphs were KILLED for exceeding 45s. A proxy only \u2014 the hidden set\n  is a different,\
    \ sealed batch.\n\n## What You Submit\n\nEdit `/app/methods/main/solver.py`, keeping this interface:\n\
    \n```python\ndef solve(data):\n    # data: {\"instances\": [{\"name\",\"n_vertices\",\"n_edges\",\"\
    edges\",\"target_k\"}, ...], ...}\n    # returns: {\"colorings\": [[color_for_vertex_0, ...], ...]}\
    \   # colors in [0, target_k)\n    ...\n```\n\nYou may add helper modules next to `solver.py`. There\
    \ is no submit step; Harbor grades\nwhatever remains under `/app/methods/main/` at the end of the\
    \ run.\n\n## How It Is Judged\n\nAfter your run, the verifier copies your `methods/main/` into a clean,\
    \ no-network sandbox and\nre-runs `solve` on sealed hidden graphs drawn from the **same generators**\
    \ as the visible\nset (n from 250 to 1000), **one graph at a time\nunder the 45s per-instance cap**.\
    \ For each graph it checks the color range and counts\nconflicting edges \u2014 fewer is better. A\
    \ crash, out-of-range color, wrong shape, or a graph over\n45s forfeits that graph, so a constant\
    \ or hard-coded answer cannot score.\n\nThe hidden graphs have **randomly permuted vertex labels**\
    \ and anonymized names. Do not rely\non graph names, vertex-index patterns, downloaded public instances,\
    \ or a precomputed coloring\ntable: a published best-known coloring is keyed to upstream labels and\
    \ does not\napply here. The task is to build a robust conflict-minimization method that transfers\
    \ from the\nvisible to the hidden graphs.\n"
  tips: Reward is the upstream reward (maximize), including raw GPU speedups. Do not inspect hidden tests.
    Follow the upstream artifact constraints.
grader:
  entrypoint: rsi_exam_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  private:
  - rsi_task
  timeout: 6300
  direction: maximize
  args:
    reward_key: reward
  parallel:
    max_workers: 1
agents:
  count: 1
  runtime: claude_code
  model: sonnet
  timeout: 43200
  research: false
workspace:
  repo_path: ./examples/rsi_exam/johnson1991_leighton_graph_coloring/seed
  results_dir: ./results
run:
  session: local
  stop:
    max_real_attempts: 1
