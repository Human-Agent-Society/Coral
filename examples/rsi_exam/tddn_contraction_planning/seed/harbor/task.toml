schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/tddn_contraction_planning"
description = "Deterministic inference-time planning for exact Tensor Decision Diagram Network contractions in quantum-circuit equivalence checking."
authors = [{ name = "aiminglab" }]

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 8
memory_mb = 16384
storage_mb = 12288
gpus = 0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 8
storage_mb = 12288
gpus = 0

[scoring]
metric = "combined_log_gain"
direction = "higher"
