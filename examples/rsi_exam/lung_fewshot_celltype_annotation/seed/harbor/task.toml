schema_version = "1.3"
artifacts = ["/app/methods", "/app/experiment_log.md"]

[task]
name = "autoresearch-arena/lung_fewshot_celltype_annotation"
description = "Improve a five-shot lung cell-type classifier using unlabeled scRNA-seq cells; graded by macro-F1 after replay on donor-disjoint sealed cells."
authors = [{ name = "haoqin tu" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 3600.0
network_mode = "public"
cpus = 4
memory_mb = 16384
storage_mb = 20480

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"
cpus = 4
memory_mb = 16384

[verifier.environment]
network_mode = "no-network"
cpus = 4
memory_mb = 16384

[scoring]
metric = "macro_f1"
direction = "higher"
