services:
  main:
    environment:
      NVIDIA_VISIBLE_DEVICES: "$HARBOR_GPU_DEVICE"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["$HARBOR_GPU_DEVICE"]
              capabilities: [gpu]
