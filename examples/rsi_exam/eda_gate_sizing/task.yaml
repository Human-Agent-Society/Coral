task:
  name: rsi-exam-eda_gate_sizing
  description: "Optimize the RSI-Exam task below. The CORAL worktree mirrors /app for submission paths\
    \ only: edit methods/ (and other declared artifacts). Public support code and Docker build inputs\
    \ are in harbor/environment/. Read instruction.md for the upstream contract.\n\nStart with `uv run\
    \ rsi_runtime.py bootstrap` to extract any missing image-generated baseline artifacts. Run visible\
    \ experiments with `uv run rsi_runtime.py run 'python /app/selfcheck.py'` (or the command in instruction.md).\
    \ This executes inside the original agent container and copies declared submission artifacts back\
    \ to the worktree.\n\nUse visible feedback for iteration, then submit the final method with `coral\
    \ eval -m 'final method'`. The default run stops after one real evaluation. Only declared artifacts\
    \ cross to the original separate verifier. Changing rsi_runtime.py, harbor/, or local support files\
    \ does not change the trusted grader. --tune does not run hidden tests.\n\n# Optimize logic gate sizing\
    \ under timing and design-rule penalties\n\n## Background\n\nA chip is built from millions of tiny\
    \ logic gates, and the same gate comes in several sizes that\ndo the identical job. A bigger one switches\
    \ faster, but burns more power and is heavier for the\ngate feeding it to push. Picking a size for\
    \ every gate, so that no signal arrives late and as\nlittle power as possible is wasted, is called\
    \ **gate sizing**.\n\nIt is one of the last steps in chip design before a layout goes to a factory.\
    \ It is hard because\nthe right size differs from gate to gate and the gates pull on each other: enlarging\
    \ one slows the\ngate in front of it, and the timing you start from describes the chip before you\
    \ touched it.\n\n## Instruction\n\nGiven a placed netlist described by CircuitOps IR tables, assign\
    \ a library cell to every instance\nso as to minimize **one score** charging timing (TNS) and design-rule\
    \ (slew / capacitance)\nviolations, plus the leakage you spend clearing them. Your submission is re-run\
    \ on sealed hidden\ncases; **lower is better**.\n\n`/app/methods/main/` ships a working but crude\
    \ reference implementation. It is there to define the\nzero point and to show the plumbing, **not\
    \ to be the starting shape of your answer**. You may\ndelete all of it and design your method from\
    \ scratch. The only fixed parts of a submission are the\n`solve(...)` contract and the `.size` output\
    \ format below. What your method looks at, what it\ndecides per instance, and how it searches are\
    \ entirely yours to choose.\n\n### Hard Constraints\n\n- Submit an **algorithm** (`solve`), not precomputed\
    \ answers. Do not key on case names.\n- Keep the exact signature `solve(input_dir: str, output_path:\
    \ str) -> None`: read one case from\n  `input_dir`, write a valid `.size` file to `output_path`.\n\
    - **Sequential cells and macros** keep their original library cell. Only **combinational** cells\n\
    \  may be resized.\n- A combinational cell may only move to a cell with the **same `func_id`** (logically\
    \ equivalent,\n  different drive strength or threshold), read from `libcell_properties.csv.bz2`.\n\
    - List **every instance exactly once**, with no unknown instance or library-cell names. An illegal\n\
    \  sizing scores nothing.\n- `solve` must be deterministic and case-name-independent.\n\n### What\
    \ You Have\n\n- Visible cases at `/app/data/<case>/` for each case in `/app/data/manifest.json`, each\
    \ with\n  `IR_Tables/` (`cell_properties`, `libcell_properties`, `pin_properties`, `net_properties`\
    \ and the\n  graph edge tables, all `*.csv.bz2`) and `design/` (compressed `.v`/`.def`/`.sdc`). The\
    \ shared\n  library is at `/app/data/platform/ASAP7`. Hidden cases are different designs, same format.\n\
    - `/app/methods/main/` \u2014 **this directory is what gets graded**. The shipped `solver.py` handles\n\
    \  the contract and the `.size` format and applies a uniform strongest-drive upsize. **Its score is\n\
    \  the zero point**: matching it earns nothing, and scoring worse earns nothing either. Rewrite it,\n\
    \  throw it away and start over, or add any helper Python next to it (`python3`, `numpy`, `pandas`,\n\
    \  `scikit-learn` available).\n- **Your self-check surface** (free, unlimited): `python /app/selfcheck.py`\
    \ runs your current\n  `solver.py` on the visible cases through the **same legality gate and the same\
    \ OpenROAD score**\n  the sealed grader uses, and prints the breakdown into `10*|TNS|`, `20*slew`,\
    \ `20*cap` and\n  leakage. A case name limits it to that case (`python /app/selfcheck.py <case>`);\
    \ the scoring\n  pass takes minutes on the large cases.\n\n### What You Submit\n\n`/app/methods/main/solver.py`\
    \ must expose this exact signature. It and the `.size` format\nbelow are the only parts of a submission\
    \ that are fixed:\n\n```python\ndef solve(input_dir: str, output_path: str) -> None:\n    ...\n```\n\
    \nThe `.size` output is one line per instance:\n\n```text\n<instance name> <library cell name>\n```\n\
    \nThere is no submit step and no per-attempt feedback. Work and self-check for as long as your run\n\
    window allows, then leave your best `solver.py` in place; it is graded once at the end.\n\n### How\
    \ It Is Judged\n\nThe grader copies `methods/main/` into a clean sandbox, runs `solve(...)` on each\
    \ hidden case,\nchecks legality, then evaluates the sizing with a timing engine. The per-case score\
    \ is\n\n```text\nscore = leakage_delta_uW + 10*|TNS_ns| + 20*slew_violation + 20*cap_violation\n```\n\
    \n`leakage_delta_uW` is your leakage minus the original netlist's, so leaving a cell alone costs\n\
    nothing. `TNS` is total negative slack; `slew` and `cap` are the summed amounts by which pins\nexceed\
    \ their transition-time and load-capacitance limits. **Each penalty term switches off\nentirely once\
    \ its violation reaches zero**, so driving a category to exactly 0 is worth more than\ndriving it\
    \ low. Scoring is per case against that case's own reference points, then averaged, so a\ncase you\
    \ ignore cannot be carried by one you optimize. **Lower is better.** Your solver's\nwall-clock time\
    \ is not scored, though it is capped.\n"
  tips: Reward is the upstream reward (maximize), including raw GPU speedups. Do not inspect hidden tests.
    Follow the upstream artifact constraints.
grader:
  entrypoint: rsi_exam_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  private:
  - rsi_task
  timeout: 29700
  direction: maximize
  args:
    reward_key: reward
  parallel:
    max_workers: 1
agents:
  count: 1
  runtime: claude_code
  model: sonnet
  timeout: 43200
  research: false
workspace:
  repo_path: ./examples/rsi_exam/eda_gate_sizing/seed
  results_dir: ./results
run:
  session: local
  stop:
    max_real_attempts: 1
