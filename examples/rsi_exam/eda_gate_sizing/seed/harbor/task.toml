schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/eda_gate_sizing"
description = "Choose a library cell per instance to minimize power under timing/DRV constraints on placed netlists (CircuitOps IR tables); submit an algorithm, graded on sealed hidden designs, lower is better."
authors     = [{ name = "xingbo du" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 7200.0
network_mode = "public"
cpus       = 8
memory_mb  = 32768
storage_mb = 30720
gpus       = 0

[verifier]
timeout_sec      = 14400.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
memory_mb    = 49152
cpus         = 8

[scoring]
metric = "mean_score"
direction = "lower"
