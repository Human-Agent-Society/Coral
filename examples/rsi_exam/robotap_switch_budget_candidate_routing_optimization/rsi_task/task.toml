schema_version = "1.3"
artifacts = ["/app/methods", "/app/experiment_log.md"]

[task]
name = "autoresearch-arena/switch_budget_candidate_routing"
description = "Optimize semantic candidate routing and visibility under a four-switch temporal budget, scored by mean per-video Average Jaccard on a sealed split."
authors = [{ name = "aiminglab" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 1
memory_mb = 12288
storage_mb = 16384
gpus = 0

[verifier]
timeout_sec = 1800.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
storage_mb = 16384
gpus = 0

[scoring]
metric = "mean_video_average_jaccard_under_four_switch_budget"
direction = "higher"
