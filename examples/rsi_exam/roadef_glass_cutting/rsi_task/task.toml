schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "campaign-003/glass_cutting_v1"
description = "Cut a batch of rectangular glass items out of the fewest 6000x3210 stock plates on a guillotine line, minimising wasted area, on an unseen unseen industrial instance. Solutions must respect exact 3-stage guillotine cuts, defect avoidance, min/max cut distances, min-waste, and per-stack production sequence; the official checker validates and measures every solution. The score is relative to a reproduced strong reference solver and the network is sealed so neither the winner's code nor the reference solutions can be fetched. "
authors     = [{ name = "xinyu ye" }]

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 4
memory_mb  = 12288
storage_mb = 10240
gpus       = 0

[verifier]
timeout_sec      = 3600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[verifier.env]
PER_CASE_TIMEOUT_SEC = "40"

[scoring]
metric = "mean_relative_score_vs_reference"
direction = "higher"
