schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/cxr_ood_triage_policy"
description = "Improve a weak chest-X-ray triage policy over frozen classifier scores. You submit triage(cases, resources, seed); a sealed verifier refers the top-risk studies under a fixed shared budget across an in-domain and an unseen site, and scores mean sensitivity minus a Brier (calibration) penalty minus a worst-site gap. Raw scores are not cross-site comparable; the headroom is in cross-site calibration."
authors     = [{ name = "yuhan" }]

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 2
memory_mb  = 12288
storage_mb = 10240
gpus       = 0

[verifier]
timeout_sec      = 5400.0
environment_mode = "separate"
cpus             = 2
memory_mb        = 256

[verifier.environment]
network_mode = "no-network"

[scoring]
metric    = "triage_utility_pct"
direction = "higher"
