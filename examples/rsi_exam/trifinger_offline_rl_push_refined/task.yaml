task:
  name: rsi-exam-trifinger_offline_rl_push_refined
  description: "Optimize the RSI-Exam task below. The CORAL worktree mirrors /app for submission paths\
    \ only: edit methods/ (and other declared artifacts). Public support code and Docker build inputs\
    \ are in harbor/environment/. Read instruction.md for the upstream contract.\n\nStart with `uv run\
    \ rsi_runtime.py bootstrap` to extract any missing image-generated baseline artifacts. Run visible\
    \ experiments with `uv run rsi_runtime.py run 'python /app/selfcheck.py'` (or the command in instruction.md).\
    \ This executes inside the original agent container and copies declared submission artifacts back\
    \ to the worktree.\n\nUse visible feedback for iteration, then submit the final method with `coral\
    \ eval -m 'final method'`. The default run stops after one real evaluation. Only declared artifacts\
    \ cross to the original separate verifier. Changing rsi_runtime.py, harbor/, or local support files\
    \ does not change the trusted grader. --tune does not run hidden tests.\n\n# Learn a TriFinger cube-pushing\
    \ policy from a fixed offline dataset\n\nYou inherit an **offline reinforcement learning** problem\
    \ on the TriFinger robot simulator: a\nthree-fingered robot must push a cube to a target position,\
    \ and you may only learn from a **fixed,\npre-collected dataset** of past trajectories (no live simulator\
    \ interaction during training). The\nshipped `methods/main/solver.py` is a deliberately weak behavior-cloning\
    \ baseline. You train a policy\nand save a checkpoint; a sealed verifier then **reloads your checkpoint\
    \ and re-runs your policy** on a\nhidden, disjoint batch of episodes you never see (it does NOT re-train),\
    \ scoring the mean **return**\nacross those episodes (higher is better).\n\n## Hard Constraints\n\n\
    - **CRITICAL (artifact-eval timeout safety):** your `train()` MUST persist the checkpoint to `out_dir`\n\
    \  (`/app/submission/model`) **incrementally, not only at the very end**. The grader scores whatever\
    \ is\n  in `/app/submission/model` at the deadline; saving only at the end and hitting the timeout\
    \ leaves an\n  empty submission and scores 0. Populate it early and keep overwriting.\n- You may only\
    \ edit code under `/app/methods/main/`; you may add sibling `.py` modules. **The two\n  entrypoints\
    \ and their signatures must not change** \u2014 the verifier imports them directly:\n  - `train(dataset_dir:\
    \ str, out_dir: str, device: str = \"cpu\") -> None` \u2014 train an offline-RL policy\n    on the\
    \ dataset cached in `dataset_dir` and **save everything needed to reload it** into `out_dir`.\n  \
    \  Any layout works as long as your own `Policy.__init__` can read it back \u2014 several files, an\n\
    \    `.npz`, a subdirectory, whatever you like. The verifier only checks that `out_dir` exists and\
    \ is\n    not empty. Naming your main checkpoint `model.pt` (as the shipped starter does) is **suggested**\n\
    \    for consistency, not required.\n  - `class Policy(trifinger_rl_datasets.PolicyBase)` \u2014 `__init__(self,\
    \ action_space, observation_space,\n    episode_length)` must load your checkpoint from `os.environ.get(\"\
    MODEL_DIR\",\n    \"/app/submission/model\")` (the base class signature is fixed by the upstream library,\
    \ so the\n    checkpoint path travels through this env var, not a constructor argument);\n    `get_action(self,\
    \ observation) -> np.ndarray` returns the 9-dim torque action for a 97-dim flat\n    observation.\
    \ No ground truth, no re-training, no network calls inside `get_action`.\n- **Your policy must be\
    \ deterministic given the observation stream** \u2014 no unseeded randomness inside\n  `get_action`.\
    \ The verifier scores by replaying your recorded action trace on a fresh copy of each\n  episode;\
    \ nondeterminism makes the replayed score diverge from what you saw.\n- Train only on the shipped\
    \ dataset; do not download or fabricate additional trajectories, and do not\n  call the live simulator\
    \ to generate new rollouts during training (this is an *offline*-RL task).\n- A crash or an empty\
    \ checkpoint directory scores 0. Note what non-determinism actually costs you:\n  the verifier does\
    \ **not** run a determinism check, so a non-deterministic policy is not detected or\n  penalised as\
    \ such \u2014 instead your local evaluation and the graded value simply stop agreeing, and\n  you\
    \ have no way to tell which one is right. Also note that a crash *inside a single episode* only\n\
    \  zeroes **that** episode (it contributes 0.0 to the mean), not the whole submission; a crash while\n\
    \  loading your `Policy` zeroes everything.\n\n**The grading budget, in full \u2014 size your policy\
    \ against it.** You get no per-attempt feedback, so\nthese numbers are published rather than left\
    \ for you to guess:\n\n| | grading run | your own session / free `selfcheck.py` |\n|---|---|---|\n\
    | episodes rolled out | **32** sealed (hidden), then replayed once each | 100 visible (`selfcheck.py`),\
    \ plus any seeds you pick yourself |\n| judged data scale vs. visible | **0.32\xD7** the self-check\
    \ pool | \u2014 |\n| wall-clock, whole grading container | **9000 s** | your session budget is 32400\
    \ s (9 h) |\n| wall-clock, your policy's rollout phase | **3600 s** for all 32 episodes (~112 s/episode)\
    \ | none |\n| wall-clock, the sealed replay afterwards | 1800 s (does not run your code) | \u2014\
    \ |\n| CPU / memory | **4 cores / 4096 MB** | 4 cores / 16384 MB |\n\nTwo consequences worth planning\
    \ around. First, **grading gives your policy less RAM than your own\nsession does** (4 GB vs 16 GB):\
    \ a checkpoint you can train comfortably may still be too heavy to\n*load and run* at grading time\
    \ \u2014 size the deployed model, not just the training job. Second,\n`get_action` is called 750 times\
    \ per episode \xD7 32 episodes = 24,000 times inside that 3600 s; a\nper-call cost above ~140 ms will\
    \ not finish. If your policy does run out of wall clock, the episodes\nthat already completed are\
    \ still scored and the unreached ones count as return 0.0 \u2014 a slow policy\ndegrades, it is not\
    \ thrown away \u2014 but that is a floor, not a plan.\n\n## What You Have\n\n- `/app/data/trifinger_dataset/`:\
    \ the visible offline dataset `trifinger-cube-push-sim-mixed-v0`\n  (~2.9M transitions of `(observation,\
    \ action, reward, timeout)`, mixed quality \u2014 expert, weak, and\n  near-random trajectories).\
    \ Load it with the standard `trifinger_rl_datasets` API: `gym.make(\n  \"trifinger-cube-push-sim-mixed-v0\"\
    , data_dir=\"/app/data/trifinger_dataset\").unwrapped.get_dataset()`.\n  Observations are 97-dim flat\
    \ vectors (robot joint state, cube pose+keypoints, goal, previous action);\n  actions are 9-dim joint\
    \ torques in `[-0.397, 0.397]`.\n- `/app/methods/main/solver.py`: the weak BC starter (`train()` +\
    \ `Policy`) \u2014 **this directory is what\n  gets graded**, together with the checkpoint you save\
    \ under `/app/submission/model/`. Improve it in\n  place or replace the algorithm entirely (e.g. a\
    \ genuine offline-RL method).\n- `/app/trifinger_score.py`: the **exact** seeding / env / run / replay\
    \ helpers the verifier uses.\n  Read it to see precisely how episodes are seeded and how a recorded\
    \ action trace is replayed. It\n  does **not** contain the metric-to-score mapping \u2014 that lives\
    \ only on the sealed side. All you need\n  to know about it is that your score rises monotonically\
    \ with the mean return.\n- `/app/selfcheck.py`: a free, unlimited local dry-run (`python /app/selfcheck.py`)\
    \ that trains your\n  solver to a scratch checkpoint and reports the mean return (\xB1 standard error)\
    \ on 100 visible\n  episodes drawn from the **same episode distribution** as the hidden sealed batch\
    \ (independent\n  draws from one family, with no seed shared between the two pools). Use it for **relative**\n\
    \  comparison \u2014 \"is change A better than change B\" \u2014 where it is reliable, because both\
    \ sides are\n  measured on the same fixed episodes and the episode-to-episode noise cancels. Do **not**\
    \ read a\n  single visible mean as a point estimate of your sealed score: at intermediate skill levels\
    \ the\n  per-episode spread is wide enough that the two pools' means can differ by ~50 return purely\
    \ by\n  sampling, in either direction. And it stops being informative at all the moment you tune\n\
    \  against it. You may also evaluate a trained policy on episode seeds of your\n  own choosing via\
    \ `/app/trifinger_score.py` (`seed_episode` + `run_policy_episode`): simulator use\n  for *evaluation\
    \ and model selection* is allowed and encouraged; only *training on simulator\n  rollouts* is forbidden.\n\
    \n## What You Submit\n\nEdit `/app/methods/main/solver.py`, keeping the `train` / `Policy` contract:\n\
    \n```python\ndef train(dataset_dir: str, out_dir: str, device: str = \"cpu\") -> None:\n    ...  #\
    \ load the dataset, train, save a checkpoint into out_dir (checkpoint every epoch/N steps)\n\nclass\
    \ Policy(PolicyBase):\n    def __init__(self, action_space, observation_space, episode_length):\n\
    \        ...  # load the checkpoint from os.environ.get(\"MODEL_DIR\", \"/app/submission/model\")\n\
    \    def get_action(self, observation):\n        ...  # return a 9-dim torque action\n```\n\nThen\
    \ **run it to produce the checkpoint**: `python /app/methods/main/solver.py` trains on the visible\n\
    dataset and saves the checkpoint to `/app/submission/model/`. Leave both the edited `solver.py` and\
    \ the\ntrained checkpoint in place \u2014 there is no submit step and no per-attempt feedback; the\
    \ verifier grades\nonce at the end. The headroom over plain behavior cloning: the dataset mixes trajectories\
    \ of very\ndifferent quality, and a method that can tell the good transitions from the bad ones can\
    \ exploit that\nspread \u2014 imitating everything uniformly, as plain BC does, cannot.\n\n## How\
    \ It Is Judged\n\nAfter your run, the verifier copies `methods/main/` and `/app/submission/model/`\
    \ into a sealed sandbox,\n**loads your checkpoint and re-runs your `Policy.get_action()`** in a rollout\
    \ on a HIDDEN, disjoint\nbatch of episodes (it does NOT re-train), replays the recorded action trace\
    \ on a fresh copy of each\nepisode to independently recompute the return, and scores the **mean return**\
    \ across the batch (higher\nis better). Your score rises monotonically with the mean return, so pushing\
    \ the return up is always the\ngoal. A policy that fails to load, or an empty `/app/submission/model/`,\
    \ scores 0; an episode your\npolicy crashes in contributes 0.0 to the mean and the rest still count.\
    \ Actions must be finite 9-dim\nvectors \u2014 a trace containing NaN or inf is rejected outright\
    \ and scores 0.\n"
  tips: Reward is the upstream reward (maximize), including raw GPU speedups. Do not inspect hidden tests.
    Follow the upstream artifact constraints.
grader:
  entrypoint: rsi_exam_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  private:
  - rsi_task
  timeout: 17100
  direction: maximize
  args:
    reward_key: reward
  parallel:
    max_workers: 1
agents:
  count: 1
  runtime: claude_code
  model: sonnet
  timeout: 43200
  research: false
workspace:
  repo_path: ./examples/rsi_exam/trifinger_offline_rl_push_refined/seed
  results_dir: ./results
run:
  session: local
  stop:
    max_real_attempts: 1
