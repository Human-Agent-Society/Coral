schema_version = "1.3"
artifacts = ["/app/methods", "/app/submission"]

[task]
name        = "autoresearch-arena/trifinger_offline_rl_push"
description = "Learn a cube-pushing policy for the TriFinger robot from a fixed offline dataset (no live simulator access during training). You submit train(dataset_dir, out_dir) that saves a checkpoint plus a Policy class; a sealed verifier reloads the checkpoint and re-runs it on a hidden batch of episodes, replaying the recorded action trace to score the mean return (higher is better). The band runs from a random-policy floor up to a sealed expert level. Pure CPU."
authors     = [{ name = "kaiwen xiong" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 3600.0
network_mode = "public"
cpus       = 4
memory_mb  = 16384
storage_mb = 10240
gpus       = 0

[verifier]
timeout_sec      = 9000.0
environment_mode = "separate"
cpus       = 4
memory_mb  = 4096

[verifier.environment]
network_mode = "no-network"

[scoring]
metric    = "mean_episode_return"
direction = "higher"
