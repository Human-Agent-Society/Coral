task:
  name: rsi-exam-citywide_signal_coordination
  description: "Optimize the RSI-Exam task below. The CORAL worktree mirrors /app for submission paths\
    \ only: edit methods/ (and other declared artifacts). Public support code and Docker build inputs\
    \ are in harbor/environment/. Read instruction.md for the upstream contract.\n\nStart with `uv run\
    \ rsi_runtime.py bootstrap` to extract any missing image-generated baseline artifacts. Run visible\
    \ experiments with `uv run rsi_runtime.py run 'python /app/selfcheck.py'` (or the command in instruction.md).\
    \ This executes inside the original agent container and copies declared submission artifacts back\
    \ to the worktree.\n\nUse visible feedback for iteration, then submit the final method with `coral\
    \ eval -m 'final method'`. The default run stops after one real evaluation. Only declared artifacts\
    \ cross to the original separate verifier. Changing rsi_runtime.py, harbor/, or local support files\
    \ does not change the trusted grader. --tune does not run hidden tests.\n\n# City-Wide Signal Coordination\n\
    \nYou inherit a full-city traffic microsimulation \u2014 a real metropolitan road network with\n~600\
    \ signalised junctions and a synthetic morning-peak demand \u2014 running on its original,\nun-optimised\
    \ static signal timing. Improve the signal control so the whole\ncity moves better under load, minimising\
    \ this frozen cost (the exact definition lives in\n`sim/eval_core.py`):\n\n```\nCost =     1 \xB7\
    \ \u03A3 timeLoss     seconds of delay over arrived vehicles\n     +   160 \xB7 teleports      SUMO\
    \ teleports, charged the time-to-teleport\n     +    20 \xB7 \u03A3 stops        number of stops (energy\
    \ / emission proxy)\n     +  3600 \xB7 unfinished     vehicles still in-network or pending at END\n\
    ```\n\nNote the last term: `3600 \xB7 unfinished` is the *largest* component at every load in this\n\
    band, so serving vehicles at all matters more than shaving delay off the ones that\nalready get through.\
    \ You submit a signal program and/or an online controller; it is\nre-run on sealed hidden load and\
    \ seed settings and scored by the same frozen cost, lower\nis better.\n\n## Hard Constraints\n\n-\
    \ You may change **signals only** \u2014 phase selection, phase durations, and offsets. You\n  may\
    \ not modify the network, the demand, or vehicle models.\n- Your submission is the directory `methods/main/`.\
    \ It may contain:\n  - `controller.py` exposing `class Controller` with `setup(conn)` (called once\
    \ with the\n    live libsumo connection) and `step(t)` (called every simulation step), and/or\n  -\
    \ `tls.add.xml`, a static `tlLogic` program loaded as a SUMO additional file. It may\n    **only**\
    \ contain `tlLogic`/`phase`/`param` elements. The verifier snapshots the file\n    and checks the\
    \ snapshot against that whitelist before the simulation starts, so any\n    other additional-file\
    \ element (`rerouter`, `calibrator`, ...) \u2014 which would change the\n    demand or the network\
    \ \u2014 makes the run invalid (baseline score for every case).\n- Signal programs are handed to SUMO\
    \ as-is: it is the simulator, not a separate rule\n  checker, that decides what a program does. There\
    \ is **no** min-green / yellow-transition\n  / conflict-matrix / cycle-length validator \u2014 a program\
    \ SUMO accepts will run, and you\n  are scored on the traffic it produces, not on whether it looks\
    \ conventional. A solution\n  that crashes, or whose additional-file is rejected, scores the baseline\
    \ for that case.\n- An online controller must be light: per-step decisions run inside the sim loop.\n\
    \n## What You Have\n\n- `sim/eval_core.py` \u2014 the exact, frozen scoring core (the cost formula,\
    \ demand window,\n  and SUMO flags). Read it to understand precisely how you are scored.\n- `methods/main/controller.py`\
    \ \u2014 the weak baseline you edit (a no-op: the city runs its\n  original static timing). `methods/main/tls_info.json`\
    \ \u2014 per-junction phase/link\n  structure you can use to build programs or controllers.\n- `selfcheck.py`\
    \ \u2014 runs your current solution on the **visible** load settings\n  (scale 0.25 and 0.37) and\
    \ prints the raw cost. Iterate against it.\n- The full city network and demand are in the container,\
    \ under `$SCENARIO_DATA`.\n\n## What You Submit\n\nYour edited `methods/main/` (a `controller.py`\
    \ and/or a `tls.add.xml`, plus any helper\nfiles it reads). The verifier re-runs it on the hidden\
    \ settings using only the contract\nabove.\n\n## How It Is Judged\n\nThe sealed verifier runs your\
    \ solution on several hidden (load-scale, seed) cases drawn\nfrom the same load band as the visible\
    \ ones \u2014 some lighter, some heavier \u2014 and recomputes\nthe frozen cost per case. Each case's\n\
    cost is then **divided by that case's own no-op baseline cost** (the inherited static\ntiming on the\
    \ identical settings) before averaging \u2014 so no single heavy case carries\nhidden extra weight,\
    \ and the no-op baseline scores exactly 1.0 by construction. Lower\nmean normalised cost is better;\
    \ your score rises monotonically as it drops. Beating the\ninherited static timing is the goal, and\
    \ the headroom is real: the inherited timing is a\nfixed plan that never looks at a queue, on a network\
    \ where queues build very unevenly.\nIt is also a genuine local optimum \u2014 a change that helps\
    \ one corridor routinely costs\nmore somewhere downstream, so a method has to be judged city-wide,\
    \ not junction by\njunction.\n\n**Time budget.** The budget is **simulation time, not wall clock**:\
    \ every run simulates\nexactly the fixed window in `sim/eval_core.py` (`BEGIN=25200` to `END=28200`,\
    \ demand\nuntil `DEMAND_END=27000`), then stops. Vehicles not served by `END` are charged\n`W_UNFINISHED\
    \ = 3600` s each \u2014 a smooth penalty, not a disqualification \u2014 so the cost of\na given submission\
    \ is bit-identical on any machine. Separately, each hidden case has a\n**1200 s wall-clock backstop**:\
    \ a pathologically slow controller that overruns it scores\nthe baseline (normalised 1.0) for that\
    \ case. Honest controllers with light per-step work\nfinish well inside it.\n"
  tips: Reward is the upstream reward (maximize), including raw GPU speedups. Do not inspect hidden tests.
    Follow the upstream artifact constraints.
grader:
  entrypoint: rsi_exam_grader.grader:Grader
  setup:
  - uv pip install -e ./grader
  private:
  - rsi_task
  timeout: 20100
  direction: maximize
  args:
    reward_key: reward
  parallel:
    max_workers: 1
agents:
  count: 1
  runtime: claude_code
  model: sonnet
  timeout: 43200
  research: false
workspace:
  repo_path: ./examples/rsi_exam/citywide_signal_coordination/seed
  results_dir: ./results
run:
  session: local
  stop:
    max_real_attempts: 1
