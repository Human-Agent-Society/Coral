schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/citywide_signal_coordination"
description = "Coordinate signal timing across a full metropolitan road network (~600 signalised junctions) to minimise a weighted delay/teleport/stop cost under heavy demand; you submit a signal program / online controller, re-run on sealed hidden load and seed settings, lower is better."
authors     = [{ name = "Jiaqi Liu" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 5400.0
network_mode = "public"
cpus       = 8
memory_mb  = 12288
storage_mb = 10240
gpus       = 0

[verifier]
timeout_sec      = 8400.0
environment_mode = "separate"
cpus             = 2
memory_mb        = 8192

[verifier.environment]
network_mode = "no-network"

[scoring]
metric    = "mean_norm_cost"
direction = "lower"
