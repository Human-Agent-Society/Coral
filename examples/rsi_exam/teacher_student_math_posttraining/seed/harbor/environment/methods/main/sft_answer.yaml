model_name_or_path: /app/models/student
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

dataset: answer_sft
dataset_dir: /app/results/answer-sft
template: qwen3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 4

output_dir: /app/results/answer-sft-adapter
overwrite_output_dir: true
logging_steps: 10
save_strategy: 'no'
plot_loss: true
report_to: none

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 0.0001
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
gradient_checkpointing: true
flash_attn: auto
seed: 42
