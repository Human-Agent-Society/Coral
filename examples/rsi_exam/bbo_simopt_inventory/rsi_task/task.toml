schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/bbo_simopt_inventory"
description = "Design a query-efficient optimizer for a stochastic replenishment policy across varied cost and demand regimes."
authors = [{ name = "haoting zhao" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"
[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 2
memory_mb  = 12288
storage_mb = 4096
gpus = 0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"
cpus = 1
memory_mb = 512
storage_mb = 4096
gpus = 0

[verifier.environment]
network_mode = "no-network"
cpus       = 4
memory_mb  = 12288
storage_mb = 4096
gpus = 0

[scoring]
metric = "mean_log_cost_progress_auc70_final30"
direction = "higher"
