schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/locomo_longterm_memory"
description = "Redesign a minimal conversational memory system (LLM extraction + BM25-only retrieval + concise answering) so it generalizes: iterate freely on 4 visible multi-session conversations (812 QA); a sealed verifier re-runs your system on 6 unseen conversations (1,174 QA) and scores token-level F1 (higher is better)."
authors     = [{ name = "xinyu ye" }]

[agent]
timeout_sec = 43200.0
network_mode  = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.azure.com", "*.services.ai.azure.com"]

[environment]
build_timeout_sec = 3600.0
network_mode = "public"
cpus       = 4
memory_mb  = 16384
storage_mb = 30720
gpus       = 0

[environment.env]
MEMORY_LLM_API_KEY  = "${MEMORY_LLM_API_KEY}"
MEMORY_LLM_API_BASE = "${MEMORY_LLM_API_BASE:-https://api.openai.com/v1}"
MEMORY_LLM_MODEL    = "${MEMORY_LLM_MODEL:-gpt-4o-mini}"

[verifier]
timeout_sec      = 10800.0
environment_mode = "separate"

[verifier.env]
MEMORY_LLM_API_KEY  = "${MEMORY_LLM_API_KEY}"
MEMORY_LLM_API_BASE = "${MEMORY_LLM_API_BASE:-https://api.openai.com/v1}"

[verifier.environment]
network_mode  = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.azure.com", "*.services.ai.azure.com"]

[scoring]
metric    = "holdout_token_f1"
direction = "higher"
