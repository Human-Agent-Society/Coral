schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name        = "autoresearch-arena/finscope_dcf_valuation"
description = "Forecast forward value-drivers for a coverage universe from a messy fundamentals panel; graded by median absolute DCF valuation error on a sealed held-out tier."
authors     = [{ name = "shi qiu" }]

[agent]
network_mode = "no-network"
timeout_sec = 43200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus       = 2
memory_mb  = 512
storage_mb = 2048
gpus       = 0

[verifier]
timeout_sec      = 3600.0
environment_mode = "separate"
cpus             = 2
memory_mb        = 512

[scoring]
metric            = "valuation_mave"
direction         = "lower"

[verifier.environment]
network_mode = "no-network"
