schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/bbo_noisy_continuous"
description = "Design a noise-aware optimizer for multimodal continuous functions under a fixed query budget and a comparable visible/sealed normalized anytime-final metric."
authors = [{ name = "haoting zhao" }]

[agent]
timeout_sec = 43200.0
network_mode = "no-network"

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 1
memory_mb = 12288
storage_mb = 10240
gpus = 0

[verifier]
timeout_sec = 5400.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"
cpus = 1
storage_mb = 4096
gpus = 0

[scoring]
metric = "oracle_normalized_auc70_final30"
direction = "higher"
