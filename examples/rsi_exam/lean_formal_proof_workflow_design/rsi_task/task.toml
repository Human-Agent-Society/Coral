schema_version = "1.3"
artifacts = ["/app/methods"]

[task]
name = "autoresearch-arena/lean_formal_proof_workflow_design"
description = "Design one verifier-guided workflow that proves fixed formal theorem statements with a pinned language model under per-problem inference, compiler-check, and wall-clock budgets."
authors = [{ name = "aiminglab" }]

[agent]
timeout_sec = 43200.0
network_mode  = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.azure.com", "*.services.ai.azure.com"]

[environment]
build_timeout_sec = 7200.0
network_mode = "public"
cpus = 8
memory_mb = 32768
storage_mb = 40960
gpus = 0

[environment.env]
LEAN_GPT54_MODEL_API_KEY  = "${LEAN_LLM_API_KEY}"
LEAN_GPT54_MODEL_BASE_URL = "${LEAN_LLM_API_BASE:-https://api.openai.com/v1}"

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"
cpus = 8

[verifier.environment]
network_mode  = "allowlist"
allowed_hosts = ["api.openai.com", "*.openai.azure.com", "*.services.ai.azure.com"]
cpus = 8
storage_mb = 40960
gpus = 0

[verifier.env]
LEAN_GPT54_MODEL_API_KEY  = "${LEAN_LLM_API_KEY}"
LEAN_GPT54_MODEL_BASE_URL = "${LEAN_LLM_API_BASE:-https://api.openai.com/v1}"

[scoring]
metric = "lean_compile_accuracy_pct"
direction = "higher"
